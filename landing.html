<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mark Pardede — game developer and web developer. Choose a path."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/pages/persona-shared.css" />
    <link rel="stylesheet" href="assets/css/pages/landing.css" />
    <script type="module" src="assets/js/modules/landing.js"></script>
    <title>Mark Pardede — Choose Your Path</title>
  </head>
  <body>
    <main class="landing" data-landing>
      <a
        class="landing-panel landing-panel--game"
        href="game-dev.html"
        data-panel="game"
      >
        <div class="landing-panel__grid" aria-hidden="true"></div>
        <div class="landing-panel__content">
          <h2 class="landing-panel__title">Game<br />developer</h2>
          <div class="landing-panel__stats">
            <div class="landing-stat">
              <span class="landing-stat__label">shipped</span>
              <span class="landing-stat__value">3 games</span>
            </div>
            <div class="landing-stat">
              <span class="landing-stat__label">competitions</span>
              <span class="landing-stat__value landing-stat__value--highlight"
                >2 placed</span
              >
            </div>
            <div class="landing-stat">
              <span class="landing-stat__label">on store</span>
              <span class="landing-stat__value">App Store ×1</span>
            </div>
            <div class="landing-panel__cta">enter →</div>
          </div>
        </div>
      </a>

      <a
        class="landing-panel landing-panel--web"
        href="index.html"
        data-panel="web"
      >
        <div class="landing-panel__grid" aria-hidden="true"></div>
        <div class="landing-panel__mark" aria-hidden="true"></div>
        <div class="landing-panel__content">
          <h2 class="landing-panel__title">Web<br />developer</h2>
          <div class="landing-panel__stats">
            <div class="landing-stat">
              <span class="landing-stat__label">focus</span>
              <span class="landing-stat__value">front-end</span>
            </div>
            <div class="landing-stat">
              <span class="landing-stat__label">work</span>
              <span class="landing-stat__value">client &amp; personal</span>
            </div>
            <div class="landing-stat">
              <span class="landing-stat__label">status</span>
              <span class="landing-stat__value landing-stat__value--highlight"
                >available</span
              >
            </div>
            <div class="landing-panel__cta">enter →</div>
          </div>
        </div>
      </a>
    </main>
  </body>
</html>
